services:
  db:
    image: pgvector/pgvector:pg15
    container_name: paten-db
    environment:
      POSTGRES_USER: paten
      POSTGRES_PASSWORD: paten
      POSTGRES_DB: paten
    ports:
      - "5433:5432"
    volumes:
      - paten_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paten -d paten"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  paten_pgdata:
